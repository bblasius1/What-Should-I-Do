<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>What Should I Do?</title>
<style>
  :root { font: 16px/1.5 system-ui, sans-serif; color: #fff8e9; background: #173033; }
  body { margin: 0; }
  main { max-width: 1120px; margin: auto; padding: 23px clamp(12px, 3vw, 32px); }
  header { display: flex; align-items: end; justify-content: space-between; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
  h1 { font-size: clamp(22px, 4vw, 34px); letter-spacing: -.035em; margin: 0; }
  button { color: #173033; background: #ffdc8a; border: 0; border-radius: 8px; padding: 8px 13px; font: inherit; font-weight: 650; cursor: pointer; }
  .game-controls { display: flex; flex-wrap: wrap; gap: 8px; }
  #music-status { margin: 0 0 8px; }
  button:disabled { opacity: .55; cursor: default; }
  .game { position: relative; background: #0c2327; border-radius: 12px; overflow: hidden; aspect-ratio: 16 / 9; }
  canvas { display: block; width: 100%; height: 100%; }
  canvas:focus-visible { outline: 2px solid #ffdc8a; outline-offset: -2px; }
  .status { position: absolute; inset: 0; display: grid; align-content: center; justify-items: center; gap: .35rem; background: #0c2327; padding: 12px; text-align: center; }
  .status[hidden] { display: none; }
  .status p { margin: 0; }
  progress { width: min(270px, 70%); accent-color: #ffdc8a; }
  footer { color: #d4e7df; padding-top: 9px; font-size: .9rem; }
  footer p { margin: 3px 0; }
</style>
<main>
  <header>
    <h1>What Should I Do?</h1>
    <div class="game-controls">
      <button id="music-toggle" type="button" aria-pressed="false">Background music</button>
      <button id="fullscreen" type="button" disabled>Full screen</button>
    </div>
  </header>
  <p id="music-status" role="status" hidden></p>
  <audio id="background-music" src="Audio/BGM_Street.ogg" preload="none" loop></audio>
  <div class="game">
    <canvas id="unity-canvas" width="1280" height="720" tabindex="0" aria-label="What Should I Do? game"></canvas>
    <div id="loading" class="status" role="status">
      <p id="loading-message">Loading game…</p>
      <progress id="progress" max="1" value="0" aria-label="Game download progress"></progress>
    </div>
  </div>
  <footer>
    <p><strong>Move</strong> with WASD, arrow keys, or a gamepad. Use <strong>Q / E</strong> to look and <strong>F</strong> to talk or pass.</p>
    <p>Choose English or 简体中文 in the game’s Settings.</p>
  </footer>
</main>
<script>
  const canvas = document.getElementById("unity-canvas");
  const fullscreen = document.getElementById("fullscreen");
  const loading = document.getElementById("loading");
  const message = document.getElementById("loading-message");
  const progress = document.getElementById("progress");
  const loader = document.createElement("script");
  const music = document.getElementById("background-music");
  const musicToggle = document.getElementById("music-toggle");
  const musicStatus = document.getElementById("music-status");
  let musicChoiceMade = false;

  music.volume = 0.32;

  function playMusic() {
    musicStatus.hidden = true;
    music.play().catch(error => {
      if (error.name === "AbortError") return;
      musicStatus.textContent = "Music could not start. Select Background music to retry.";
      musicStatus.hidden = false;
    });
  }

  music.addEventListener("playing", () => musicToggle.setAttribute("aria-pressed", "true"));
  music.addEventListener("pause", () => musicToggle.setAttribute("aria-pressed", "false"));
  musicToggle.addEventListener("click", () => {
    musicChoiceMade = true;
    if (music.paused) playMusic();
    else music.pause();
  });

  function startMusicOnFirstGameInteraction() {
    if (!loading.hidden || musicChoiceMade) return;
    musicChoiceMade = true;
    playMusic();
  }

  canvas.addEventListener("click", startMusicOnFirstGameInteraction);
  canvas.addEventListener("keydown", startMusicOnFirstGameInteraction);

  function showError(error) {
    progress.hidden = true;
    message.textContent = "The game could not load. Reload the page to try again.";
    console.error(error);
  }

  loader.src = "Build/BrowserFixed.loader.js";
  loader.onerror = showError;
  loader.onload = () => {
    const config = {
      dataUrl: "Build/BrowserFixed.data.unityweb",
      frameworkUrl: "Build/BrowserFixed.framework.js.unityweb",
      codeUrl: "Build/BrowserFixed.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "DefaultCompany",
      productName: "What Should I Do",
      productVersion: "0.1.0",
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, 1.5)
    };

    createUnityInstance(canvas, config, value => { progress.value = value; })
      .then(instance => {
        loading.hidden = true;
        fullscreen.disabled = false;
        fullscreen.addEventListener("click", () => instance.SetFullscreen(1));
      })
      .catch(showError);
  };
  canvas.addEventListener("pointerdown", () => canvas.focus({ preventScroll: true }));
  document.body.append(loader);
</script>
</html>
