name: Build and deploy Unity WebGL game

on:
  push:
    branches:
      - feature/audio-adaptive-learning
    paths:
      - "Assets/**"
      - "Packages/**"
      - "ProjectSettings/**"
      - ".github/workflows/build-and-deploy-webgl.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: what-should-i-do-webgl-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build Unity WebGL and publish GitHub Pages
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      WEBGL_PLAYER_DIR: build/WebGL/WhatShouldIDo
    steps:
      - name: Check out game source
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Check Unity license configuration
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        run: |
          if [ -z "$UNITY_LICENSE" ] && { [ -z "$UNITY_EMAIL" ] || [ -z "$UNITY_PASSWORD" ] || [ -z "$UNITY_SERIAL" ]; }; then
            echo "::error::Unity is not licensed for GitHub Actions. For Unity Personal, add UNITY_LICENSE, UNITY_EMAIL and UNITY_PASSWORD. For Unity Plus/Pro, add UNITY_EMAIL, UNITY_PASSWORD and UNITY_SERIAL. See https://game.ci/docs/github/activation/."
            exit 1
          fi

      - name: Cache Unity import artifacts
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-WebGL-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-WebGL-

      - name: Build WebGL with the project's Unity version
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          unityVersion: auto
          targetPlatform: WebGL
          buildName: WhatShouldIDo
          buildsPath: build

      - name: Verify the generated WebGL player
        run: |
          test -s "$WEBGL_PLAYER_DIR/index.html"
          test -d "$WEBGL_PLAYER_DIR/Build"
          find "$WEBGL_PLAYER_DIR" -maxdepth 2 -type f -printf '%p %s bytes\n' | sort
          if ! find "$WEBGL_PLAYER_DIR/Build" -type f \( -name '*.wasm' -o -name '*.wasm.unityweb' \) | grep -q .; then
            echo "::error::Unity WebGL build is missing its WebAssembly player."
            exit 1
          fi
          if ! find "$WEBGL_PLAYER_DIR/Build" -type f \( -name '*.data' -o -name '*.data.unityweb' \) | grep -q .; then
            echo "::error::Unity WebGL build is missing its data file."
            exit 1
          fi

      - name: Upload WebGL build for inspection
        uses: actions/upload-artifact@v4
        with:
          name: What-Should-I-Do-WebGL
          path: ${{ env.WEBGL_PLAYER_DIR }}
          if-no-files-found: error
          retention-days: 14

      - name: Publish the rebuilt game to the existing GitHub Pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ${{ env.WEBGL_PLAYER_DIR }}
          force_orphan: false
          commit_message: "Deploy updated Unity WebGL game from ${{ github.sha }}"
