name: Generate original game soundtrack

on:
  push:
    branches:
      - feature/audio-adaptive-learning
    paths:
      - "tools/generate_music.py"
      - ".github/workflows/build-music.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-music:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install music dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Generate and compress the four tracks
        run: python tools/generate_music.py
      - name: Commit the generated OGG recordings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Assets/Resources/Audio/Music/*.ogg
          if ! git diff --cached --quiet; then
            git commit -m "Add generated educational game music [skip ci]"
            # The feature branch may have moved while the renderer was running.
            # Rebase this asset-only commit instead of force-pushing over code changes.
            for attempt in 1 2 3 4 5; do
              git fetch origin feature/audio-adaptive-learning
              git rebase origin/feature/audio-adaptive-learning
              if git push origin HEAD:feature/audio-adaptive-learning; then
                exit 0
              fi
              sleep 2
            done
            echo "Could not publish generated music after five attempts" >&2
            exit 1
          fi
